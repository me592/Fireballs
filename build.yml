name: Build mod
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Show jar contents
        run: |
          ls -l build/libs
          unzip -l build/libs/bedwars-fireballs-1.0.0.jar
      - uses: actions/upload-artifact@v4
        with:
          name: bedwars-fireballs-jar
          path: build/libs/bedwars-fireballs-1.0.0.jar
